[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-typer"
version = "1.0.0"
description = "A macOS menu bar app that simulates human-like typing from clipboard content"
requires-python = ">=3.10"
dependencies = [
    "rumps>=0.4.0",
    "pynput>=1.7.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "anthropic>=0.78.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
verification = ["pytesseract>=0.3.10", "Pillow>=10.0.0", "opencv-python>=4.8.0"]
dev = ["pytest>=8.0", "build>=1.0", "setuptools>=68.0", "wheel"]

[project.scripts]
ghost-typer = "ghost_typer.run:main"

[tool.setuptools]
packages = ["ghost_typer", "ghost_typer.src"]
include-package-data = false

[tool.setuptools.package-dir]
ghost_typer = "."

[tool.setuptools.package-data]
ghost_typer = ["icons/*.png", "icons/*.icns"]
